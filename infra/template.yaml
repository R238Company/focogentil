AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Foco Gentil - site estatico (S3 + CloudFront), autenticacao (Cognito) e
  endpoint de envio de respostas (API Gateway HTTP API + Lambda) que grava
  cada tentativa no DynamoDB (separado por aluno) e no S3 (redundancia).

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AnswersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AnswersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alunoId
          AttributeType: S
        - AttributeName: tentativaId
          AttributeType: S
      KeySchema:
        - AttributeName: alunoId
          KeyType: HASH
        - AttributeName: tentativaId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: siteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: siteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}"

  # --- Autenticacao (Cognito) ---------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        # Sem autocadastro publico - os usuarios (alunos) sao criados a mao
        # via CLI depois do deploy (ver README).
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 4
      IdTokenValidity: 4
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # --- Backend (Lambda + DynamoDB + S3) -----------------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: writeAnswers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${AnswersBucket.Arn}/respostas/*"
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AnswersTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  SubmitAnswersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ANSWERS_BUCKET: !Ref AnswersBucket
          ANSWERS_TABLE: !Ref AnswersTable
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import datetime
          import boto3

          s3 = boto3.client("s3")
          dynamodb = boto3.resource("dynamodb")

          BUCKET = os.environ["ANSWERS_BUCKET"]
          TABLE_NAME = os.environ["ANSWERS_TABLE"]
          table = dynamodb.Table(TABLE_NAME)


          def handler(event, context):
              claims = (
                  event.get("requestContext", {})
                  .get("authorizer", {})
                  .get("jwt", {})
                  .get("claims", {})
              )
              aluno_id = claims.get("sub")
              aluno_nome = claims.get("cognito:username") or claims.get("username") or "Aluna"

              if not aluno_id:
                  return _response(401, {"erro": "nao autenticado"})

              try:
                  body = json.loads(event.get("body") or "{}")
              except Exception:
                  return _response(400, {"erro": "JSON invalido"})

              prova = str(body.get("prova", "Simulado"))[:200]
              respostas = body.get("respostas")

              if not isinstance(respostas, list) or not respostas:
                  return _response(400, {"erro": "respostas ausentes"})

              limpo = []
              for item in respostas:
                  if not isinstance(item, dict):
                      continue
                  pergunta = str(item.get("pergunta", ""))[:2000]
                  resposta = str(item.get("resposta", ""))[:20000]
                  limpo.append({"pergunta": pergunta, "resposta": resposta})

              agora = datetime.datetime.utcnow()
              tentativa_id = "{}#{}".format(agora.isoformat(), uuid.uuid4())

              registro = {
                  "aluno": aluno_nome,
                  "prova": prova,
                  "data": body.get("data") or agora.isoformat(),
                  "respostas": limpo,
              }

              table.put_item(
                  Item={
                      "alunoId": aluno_id,
                      "tentativaId": tentativa_id,
                      **registro,
                  }
              )

              key = "respostas/{}/{}.json".format(agora.strftime("%Y-%m-%d"), uuid.uuid4())
              s3.put_object(
                  Bucket=BUCKET,
                  Key=key,
                  Body=json.dumps(registro, ensure_ascii=False, indent=2).encode("utf-8"),
                  ContentType="application/json",
              )

              return _response(200, {"ok": True})


          def _response(status, body):
              return {
                  "statusCode": status,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps(body, ensure_ascii=False),
              }

  # --- API (HTTP API + autorizador JWT do Cognito) ------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${CloudFrontDistribution.DomainName}"
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, authorization]

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      Name: !Sub "${AWS::StackName}-cognito-authorizer"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SubmitAnswersFunction.Arn
      PayloadFormatVersion: "2.0"

  SubmitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /submit"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SubmitAnswersFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/submit"

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  AnswersBucketName:
    Value: !Ref AnswersBucket
  AnswersTableName:
    Value: !Ref AnswersTable
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/submit"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
