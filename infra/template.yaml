AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Foco Gentil - site estatico (S3 + CloudFront), autenticacao (Cognito) e
  endpoint de envio de respostas (API Gateway HTTP API + Lambda) que grava
  cada tentativa no DynamoDB (separado por aluno) e no S3 (redundancia).

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AnswersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AnswersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alunoId
          AttributeType: S
        - AttributeName: tentativaId
          AttributeType: S
      KeySchema:
        - AttributeName: alunoId
          KeyType: HASH
        - AttributeName: tentativaId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: siteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: siteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}"

  # --- Autenticacao (Cognito) ---------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        # Sem autocadastro publico - os usuarios (alunos) sao criados a mao
        # via CLI depois do deploy (ver README).
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 4
      IdTokenValidity: 4
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # --- Backend (Lambda + DynamoDB + S3) -----------------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: writeAnswers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${AnswersBucket.Arn}/respostas/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt AnswersTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  SubmitAnswersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ANSWERS_BUCKET: !Ref AnswersBucket
          ANSWERS_TABLE: !Ref AnswersTable
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import datetime
          import boto3

          s3 = boto3.client("s3")
          dynamodb = boto3.resource("dynamodb")

          BUCKET = os.environ["ANSWERS_BUCKET"]
          TABLE_NAME = os.environ["ANSWERS_TABLE"]
          table = dynamodb.Table(TABLE_NAME)


          def handler(event, context):
              claims = (
                  event.get("requestContext", {})
                  .get("authorizer", {})
                  .get("jwt", {})
                  .get("claims", {})
              )
              aluno_id = claims.get("sub")
              aluno_nome = claims.get("cognito:username") or claims.get("username") or "Aluna"

              if not aluno_id:
                  return _response(401, {"erro": "nao autenticado"})

              route = event.get("routeKey", "")

              if route == "PUT /progresso":
                  return _salvar_rascunho(event, aluno_id)
              if route == "GET /progresso":
                  return _carregar_rascunho(event, aluno_id)
              return _submeter(event, aluno_id, aluno_nome)


          def _materia_id(origem):
              return str(origem.get("materiaId") or "exam1")[:100]


          def _limpar_respostas(respostas, com_id):
              limpo = []
              for item in respostas or []:
                  if not isinstance(item, dict):
                      continue
                  entrada = {
                      "pergunta": str(item.get("pergunta", ""))[:2000],
                      "resposta": str(item.get("resposta", ""))[:20000],
                  }
                  if com_id:
                      entrada["id"] = str(item.get("id", ""))[:100]
                  limpo.append(entrada)
              return limpo


          def _submeter(event, aluno_id, aluno_nome):
              try:
                  body = json.loads(event.get("body") or "{}")
              except Exception:
                  return _response(400, {"erro": "JSON invalido"})

              prova = str(body.get("prova", "Simulado"))[:200]
              respostas = body.get("respostas")

              if not isinstance(respostas, list) or not respostas:
                  return _response(400, {"erro": "respostas ausentes"})

              limpo = _limpar_respostas(respostas, com_id=False)

              agora = datetime.datetime.utcnow()
              tentativa_id = "{}#{}".format(agora.isoformat(), uuid.uuid4())

              registro = {
                  "aluno": aluno_nome,
                  "prova": prova,
                  "data": body.get("data") or agora.isoformat(),
                  "respostas": limpo,
              }

              table.put_item(
                  Item={
                      "alunoId": aluno_id,
                      "tentativaId": tentativa_id,
                      **registro,
                  }
              )

              key = "respostas/{}/{}.json".format(agora.strftime("%Y-%m-%d"), uuid.uuid4())
              s3.put_object(
                  Bucket=BUCKET,
                  Key=key,
                  Body=json.dumps(registro, ensure_ascii=False, indent=2).encode("utf-8"),
                  ContentType="application/json",
              )

              if body.get("materiaId"):
                  table.delete_item(
                      Key={
                          "alunoId": aluno_id,
                          "tentativaId": "RASCUNHO#" + _materia_id(body),
                      }
                  )

              return _response(200, {"ok": True})


          def _salvar_rascunho(event, aluno_id):
              try:
                  body = json.loads(event.get("body") or "{}")
              except Exception:
                  return _response(400, {"erro": "JSON invalido"})

              materia_id = _materia_id(body)
              respostas = _limpar_respostas(body.get("respostas"), com_id=True)
              current = body.get("current")
              current = current if isinstance(current, int) else 0
              agora = datetime.datetime.utcnow().isoformat()

              table.put_item(
                  Item={
                      "alunoId": aluno_id,
                      "tentativaId": "RASCUNHO#" + materia_id,
                      "materiaId": materia_id,
                      "prova": str(body.get("prova", ""))[:200],
                      "current": current,
                      "respostas": respostas,
                      "atualizadoEm": agora,
                  }
              )

              return _response(200, {"ok": True, "atualizadoEm": agora})


          def _carregar_rascunho(event, aluno_id):
              params = event.get("queryStringParameters") or {}
              materia_id = _materia_id(params)

              item = table.get_item(
                  Key={
                      "alunoId": aluno_id,
                      "tentativaId": "RASCUNHO#" + materia_id,
                  }
              ).get("Item")

              if not item:
                  return _response(200, {"existe": False})

              return _response(200, {
                  "existe": True,
                  "current": int(item.get("current", 0)),
                  "respostas": item.get("respostas", []),
                  "atualizadoEm": item.get("atualizadoEm"),
              })


          def _response(status, body):
              return {
                  "statusCode": status,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps(body, ensure_ascii=False),
              }

  # --- API (HTTP API + autorizador JWT do Cognito) ------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${CloudFrontDistribution.DomainName}"
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [content-type, authorization]

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      Name: !Sub "${AWS::StackName}-cognito-authorizer"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SubmitAnswersFunction.Arn
      PayloadFormatVersion: "2.0"

  SubmitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /submit"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  SalvarProgressoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /progresso"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  CarregarProgressoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /progresso"
      Target: !Sub "integrations/${LambdaIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SubmitAnswersFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*"

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  AnswersBucketName:
    Value: !Ref AnswersBucket
  AnswersTableName:
    Value: !Ref AnswersTable
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/submit"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
